[project]
name = "tcp-segment-header-parser"
version = "0.1.0"
description = "Parses the fixed 20-byte TCP header into a typed object with ports, sequence numbers, flags, and window size."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
